[build]
  # Root-relative, not `base = "frontend"`: the CLI/buildbot disagree on
  # whether `publish` resolves against `base`, and this new code built with
  # the plugin looking for `.next` at the repo root.
  command = "cd frontend && npm run build"
  publish = "frontend/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
